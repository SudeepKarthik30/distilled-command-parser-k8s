apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-pvc
  namespace: data
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
  namespace: data
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: storage-engine
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
        app.kubernetes.io/name: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:latest
          imagePullPolicy: IfNotPresent
          args:
            - server
            - -dir=/data
            - -master.volumeSizeLimitMB=64
            - -volume.max=30
            - -s3
            - -s3.config=/etc/s3/s3.json
          ports:
            - name: s3-endpoint
              containerPort: 8333
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: storage-volume
              mountPath: /data
            - name: s3-credentials
              mountPath: /etc/s3
              readOnly: true
      volumes:
        - name: storage-volume
          persistentVolumeClaim:
            claimName: seaweedfs-pvc
        - name: s3-credentials
          secret:
            secretName: seaweed-s3
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: data
  labels:
    app.kubernetes.io/name: seaweedfs
spec:
  type: ClusterIP
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: 8333
      protocol: TCP
