apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: parser-ingress
  namespace: app
  labels:
    app.kubernetes.io/name: command-parser
    app.kubernetes.io/component: ingress
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /parse
            pathType: Prefix
            backend:
              service:
                name: parser
                port:
                  number: 80
